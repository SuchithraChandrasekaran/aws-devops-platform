AWSTemplateFormatVersion: '2010-09-09'
Description: 'Parent Stack - Orchestrates VPC and RDS Nested Stacks'

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod
    Default: dev
    Description: Environment type

  DBName:
    Type: String
    Default: myappdb
    Description: Database name

  DBUsername:
    Type: String
    Default: admin
    Description: Database admin username

  DBPassword:
    Type: String
    NoEcho: true
    Default: TempPassword123!
    Description: Database admin password

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  # VPC Stack (using existing template)
  VPCStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: file://vpc/vpc-multi-env.yaml
      Parameters:
        Environment: !Ref Environment
        VPCCidr: !If [IsProd, '10.1.0.0/16', '10.0.0.0/16']
        PublicSubnet1Cidr: !If [IsProd, '10.1.1.0/24', '10.0.1.0/24']
        PublicSubnet2Cidr: !If [IsProd, '10.1.2.0/24', '10.0.2.0/24']
        PrivateSubnet1Cidr: !If [IsProd, '10.1.11.0/24', '10.0.11.0/24']
        PrivateSubnet2Cidr: !If [IsProd, '10.1.12.0/24', '10.0.12.0/24']
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-vpc-nested-stack'
        - Key: Environment
          Value: !Ref Environment

  # RDS Nested Stack
  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: VPCStack
    Properties:
      TemplateURL: file://database/rds-nested.yaml
      Parameters:
        DBName: !Ref DBName
        DBUsername: !Ref DBUsername
        DBPassword: !Ref DBPassword
        Environment: !Ref Environment
        VPCId: !GetAtt VPCStack.Outputs.VPCId
        PrivateSubnet1: !GetAtt VPCStack.Outputs.PrivateSubnet1
        PrivateSubnet2: !GetAtt VPCStack.Outputs.PrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-database-nested-stack'
        - Key: Environment
          Value: !Ref Environment

Outputs:
  VPCId:
    Description: VPC ID from nested stack
    Value: !GetAtt VPCStack.Outputs.VPCId
    Export:
      Name: !Sub '${AWS::StackName}-VPCId'

  DBEndpoint:
    Description: Database endpoint from nested stack
    Value: !GetAtt DatabaseStack.Outputs.DBInstanceEndpoint
    Export:
      Name: !Sub '${AWS::StackName}-DBEndpoint'

  DBPort:
    Description: Database port from nested stack
    Value: !GetAtt DatabaseStack.Outputs.DBInstancePort
    Export:
      Name: !Sub '${AWS::StackName}-DBPort'

  StackArchitecture:
    Description: Nested stack architecture
    Value: !Sub 'Parent -> VPC Stack + Database Stack (Environment: ${Environment})'
