schemaVersion: "2.2"
description: "EC2 Instance Health Check Runbook"
parameters:
  Message:
    type: String
    description: "Health check message"
    default: "Running health check"
mainSteps:
  - action: aws:runShellScript
    name: HealthCheck
    inputs:
      runCommand:
        - echo "=== Health Check Started ==="
        - echo "Hostname: $(hostname)"
        - echo "Uptime: $(uptime)"
        - echo "Memory: $(free -m | awk 'NR==2{printf \"Used: %sMB / Total: %sMB\", $3, $2}')"
        - echo "Disk: $(df -h / | awk 'NR==2{print $5}') used"
        - echo "=== Health Check Complete ==="
