events {
  worker_connections 1024;
}

http {
  upstream app_cluster {
    server app:3000;
    keepalive 0;
  }

  server {
    listen 80;

    location / {
      proxy_pass         http://app_cluster;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_http_version 1.0;
      proxy_set_header   Connection "";
    }
  }
}
