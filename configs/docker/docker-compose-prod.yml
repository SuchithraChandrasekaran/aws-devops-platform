# Day 3- Docker Compose Configuration for Production
version: '3.8'

services:
  sample-app:
    build:
      context: ../../applications/sample-app
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    image: aws-devops-sample-app:prod
    container_name: sample-app-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - devops-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  devops-network:
    driver: bridge