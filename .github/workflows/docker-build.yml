name: Docker Build and Test

on:
  push:
    branches: [ main, develop, dev  ]
    paths:
      - 'applications/sample-app/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'applications/sample-app/**'

env:
  DOCKER_IMAGE: aws-devops-sample-app
  DOCKER_TAG: ${{ github.sha }}

jobs:
  build-and-test:
    name: Build Docker Image and Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image
        working-directory: ./applications/sample-app
        run: |
          docker build \
            -t ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} \
            -t ${{ env.DOCKER_IMAGE }}:latest \
            .
      
      - name: Run container health check
        run: |
          # Start container
          docker run -d \
            --name test-container \
            -p 3000:3000 \
            ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          
          # Wait for container to be healthy
          echo "Waiting for container to be healthy..."
          for i in {1..30}; do
            if docker ps | grep -q "test-container.*healthy"; then
              echo "Container is healthy!"
              break
            fi
            echo "Attempt $i/30..."
            sleep 2
          done
          
          # Check if container is actually healthy
          if ! docker ps | grep -q "test-container.*healthy"; then
            echo "Container failed health check!"
            docker logs test-container
            exit 1
          fi
      
      - name: Test API endpoints
        run: |
          # Test root endpoint
          echo "Testing root endpoint..."
          curl -f http://localhost:3000/ || exit 1
          
          # Test health endpoint
          echo "Testing health endpoint..."
          HEALTH_STATUS=$(curl -s http://localhost:3000/health | grep -o '"status":"[^"]*"' | cut -d'"' -f4)
          if [ "$HEALTH_STATUS" != "healthy" ]; then
            echo "Health check failed! Status: $HEALTH_STATUS"
            exit 1
          fi
          
          # Test API info endpoint
          echo "Testing API info endpoint..."
          curl -f http://localhost:3000/api/info || exit 1
          
          echo "All endpoint tests passed!"
      
      - name: Run unit tests inside container
        run: |
          docker exec test-container npm test || exit 1
      
      - name: Display container logs
        if: always()
        run: |
          echo "=== Container Logs ==="
          docker logs test-container
      
      - name: Stop and remove container
        if: always()
        run: |
          docker stop test-container || true
          docker rm test-container || true
      
      - name: Save Docker image as artifact
        if: success()
        run: |
          docker save ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} | gzip > docker-image.tar.gz
      
      - name: Upload Docker image artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar.gz
          retention-days: 7
      
      - name: Display build summary
        if: always()
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY