name: Blue-Green Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'applications/sample-app/**'

jobs:
  blue-green-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        working-directory: ./applications/sample-app
        run: npm install
      
      - name: Run tests
        working-directory: ./applications/sample-app
        run: npm test
      
      - name: Build Docker image
        run: |
          docker build -t sample-app:${{ github.sha }} ./applications/sample-app
      
      - name: Security scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            sample-app:${{ github.sha }}
      
      - name: Simulate blue-green deployment
        run: |
          echo "In production, this would trigger blue-green deployment"
          echo "For now, we run locally via scripts/deployment/blue-green-deploy.sh"
