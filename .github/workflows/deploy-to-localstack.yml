name: Deploy to LocalStack EC2

on:
  workflow_run:
    workflows: ["Docker Build and Test"]
    types:
      - completed
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

env:
  AWS_REGION: us-east-1
  LOCALSTACK_ENDPOINT: http://localhost:4566

jobs:
  deploy-to-localstack:
    name: Deploy to LocalStack EC2
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up LocalStack
        run: |
          pip install localstack awscli-local
          docker pull localstack/localstack:latest
      
      - name: Start LocalStack
        run: |
          cd infrastructure/localstack
          docker-compose up -d
          
          # Wait for LocalStack to be ready
          echo "Waiting for LocalStack to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:4566/_localstack/health > /dev/null 2>&1; then
              echo "LocalStack is ready!"
              break
            fi
            echo "Attempt $i/30..."
            sleep 2
          done
      
      - name: Configure AWS CLI for LocalStack
        run: |
          aws configure set aws_access_key_id test
          aws configure set aws_secret_access_key test
          aws configure set region ${{ env.AWS_REGION }}
      
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      
      - name: Load Docker image
        if: steps.download-artifact.outcome == 'success'
        run: |
          if [ -f docker-image.tar.gz ]; then
            docker load < docker-image.tar.gz
            echo "Docker image loaded from artifact"
          else
            echo "Artifact not found, will build image"
          fi
        continue-on-error: true
      
      - name: Build Docker image (if needed)
        working-directory: ./applications/sample-app
        run: |
          if ! docker images | grep -q aws-devops-sample-app; then
            echo "Building Docker image..."
            docker build -t aws-devops-sample-app:latest .
          else
            echo "Docker image already loaded"
          fi
      
      - name: Create EC2 instance in LocalStack
        run: |
          cd infrastructure/localstack/init-scripts
          chmod +x setup-ec2.sh
          ./setup-ec2.sh
      
      - name: Deploy application to EC2
        run: |
          cd scripts/deployment
          chmod +x deploy-to-ec2.sh
          ./deploy-to-ec2.sh
      
      - name: Run health check
        run: |
          cd scripts/deployment
          chmod +x health-check.sh
          ./health-check.sh
      
      - name: Display deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** LocalStack EC2" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** Development" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Get instance info if available
          INSTANCE_ID=$(aws --endpoint-url=${{ env.LOCALSTACK_ENDPOINT }} \
                            ec2 describe-instances \
                            --filters "Name=tag:Name,Values=aws-devops-sample-app" \
                            --query 'Reservations[0].Instances[0].InstanceId' \
                            --output text 2>/dev/null || echo "N/A")
          
          echo "- **Instance ID:** \`$INSTANCE_ID\`" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs
          path: |
            infrastructure/localstack/init-scripts/*.log
            scripts/deployment/*.log
          retention-days: 7
        continue-on-error: true
      
      - name: Cleanup LocalStack
        if: always()
        run: |
          cd infrastructure/localstack
          docker-compose down