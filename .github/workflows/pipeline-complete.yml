name: Complete CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: aws-devops-sample-app
  LOCALSTACK_ENDPOINT: http://localhost:4566
  S3_BUCKET: aws-devops-artifacts

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          cd applications/sample-app
          npm ci
      
      - name: Run tests
        run: |
          cd applications/sample-app
          npm test -- --coverage
      
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: applications/sample-app/coverage

  build:
    name: Build and Push to S3
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build Docker image
        run: |
          cd applications/sample-app
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
      
      - name: Start LocalStack
        run: |
          docker run -d --name localstack \
            -p 4566:4566 \
            -e SERVICES=s3 \
            localstack/localstack:latest
          sleep 10
      
      - name: Configure AWS CLI
        run: |
          aws configure set aws_access_key_id test
          aws configure set aws_secret_access_key test
          aws configure set region us-east-1
      
      - name: Setup S3
        run: |
          aws --endpoint-url=${{ env.LOCALSTACK_ENDPOINT }} \
            s3 mb s3://${{ env.S3_BUCKET }} || true
      
      - name: Save and upload to S3
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          VERSION="${TIMESTAMP}-${{ github.sha }}"
          
          docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} | gzip > docker-image.tar.gz
          
          aws --endpoint-url=${{ env.LOCALSTACK_ENDPOINT }} \
            s3 cp docker-image.tar.gz \
            s3://${{ env.S3_BUCKET }}/docker-images/${{ env.IMAGE_NAME }}-${VERSION}.tar.gz
          
          # Create metadata
          cat > metadata.json <<EOF
          {
            "image_name": "${{ env.IMAGE_NAME }}",
            "version": "${VERSION}",
            "git_sha": "${{ github.sha }}",
            "timestamp": "${TIMESTAMP}",
            "branch": "${{ github.ref_name }}"
          }
          EOF
          
          aws --endpoint-url=${{ env.LOCALSTACK_ENDPOINT }} \
            s3 cp metadata.json \
            s3://${{ env.S3_BUCKET }}/metadata/${{ env.IMAGE_NAME }}-${VERSION}.json
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar.gz

  deploy:
    name: Deploy to LocalStack
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
      
      - name: Load Docker image
        run: docker load < docker-image.tar.gz
      
      - name: Start LocalStack
        run: |
          docker run -d --name localstack \
            -p 4566:4566 \
            -e SERVICES=ec2 \
            localstack/localstack:latest
          sleep 15
      
      - name: Deploy application
        run: |
          docker run -d --name app -p 3000:3000 ${{ env.IMAGE_NAME }}:${{ github.sha }}
          sleep 5
      
      - name: Health check
        run: |
          curl http://localhost:3000/health
          echo "Pipeline complete! Application deployed successfully."