name: Complete CI/CD Pipeline

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd applications/sample-app
          npm ci

      - name: Run unit tests
        run: |
          cd applications/sample-app
          npm test

      - name: Generate coverage report
        run: |
          cd applications/sample-app
          npm run coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: applications/sample-app/coverage/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          cd applications/sample-app
          docker build -t sample-app:${{ github.sha }} .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sample-app:${{ github.sha }}
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy report
        uses: actions/upload-artifact@v3
        with:
          name: trivy-report
          path: trivy-report.json

      - name: Check security gate
        run: |
          CRITICAL=$(cat trivy-report.json | grep -o '"Severity":"CRITICAL"' | wc -l || echo "0")
          if [ $CRITICAL -gt 0 ]; then
            echo "CRITICAL vulnerabilities found: $CRITICAL"
            exit 1
          fi

  build:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          cd applications/sample-app
          docker build -t sample-app:latest .

      - name: Save image as artifact
        run: |
          docker save sample-app:latest | gzip > sample-app.tar.gz

      - name: Upload to artifacts
        uses: actions/upload-artifact@v3
        with:
          name: docker-image
          path: sample-app.tar.gz

  deploy:
    name: Deploy to LocalStack
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v3
        with:
          name: docker-image

      - name: Deploy notification
        run: |
          echo "Deployment would happen here"
          echo "Image ready for deployment"